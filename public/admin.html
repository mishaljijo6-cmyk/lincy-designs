<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f1e8"><meta name="robots" content="noindex,nofollow"><link rel="icon" type="image/svg+xml" href="lincy-logo.svg">
<title>Private Admin · LINCY DESIGNS</title><link rel="stylesheet" href="store.css">
</head>
<body class="admin-page">
<div class="announcement">LINCY DESIGNS <span>✳</span> PRIVATE STORE STUDIO</div>
<header class="header admin-header"><a class="brand" href="index.html"><img class="lincy-logo" src="lincy-logo.svg" alt="LINCY DESIGNS"></a><a class="admin-store-link" href="index.html">← View storefront</a></header>
<main class="section admin-shell">
<section class="admin-login-card" id="adminLogin" aria-labelledby="adminLoginTitle"><span class="kicker">PRIVATE ACCESS</span><h1 id="adminLoginTitle">Welcome back.</h1><p>Use the admin email and password created in Supabase Authentication.</p><form id="adminLoginForm" class="admin-login-form"><label for="adminEmail">User ID</label><input id="adminEmail" name="email" type="email" autocomplete="username" placeholder="Your admin email" required><label for="adminPassword">Password</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="Your password" required><button class="button dark full" id="adminLoginButton">Sign in securely</button><small class="admin-login-hint">Admin access is limited to the store owner account.</small><p class="admin-message" id="adminLoginMessage" role="status"></p></form></section>
<section class="admin-dashboard hidden" id="adminDashboard"><div class="section-head"><div><span class="kicker">YOUR LITTLE STUDIO</span><h1>Store <em>overview.</em></h1><p>Product catalogue and incoming orders.</p></div><div class="admin-dashboard-actions"><span id="adminIdentity"></span><button class="button outline" id="adminSignOut">Sign out</button><button class="button dark" id="newProduct">＋ Add a product</button></div></div><div class="admin-stats" id="stats"></div><div class="admin-tabs"><button class="active" data-tab="products">Products</button><button data-tab="orders">Orders</button><button data-tab="coupons">Coupons</button></div><p class="admin-message" id="dashboardMessage" role="status"></p><div id="adminContent"></div></section>
</main>
<div class="overlay hidden" id="overlay"></div><div class="modal hidden" id="adminModal"><button class="close modal-close" data-close aria-label="Close product editor">×</button><div id="formContent"></div></div><div class="toast" id="toast"></div>
<script src="loading.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" integrity="sha384-YieCqqg9gQufX7+5HcFvCEg/n3KUEdl8/Jb+A6J0npf1mB740VayvwKjTrtCeUoy" crossorigin="anonymous"></script><script src="supabase-config.js"></script><script src="admin.js"></script>
</body></html>
